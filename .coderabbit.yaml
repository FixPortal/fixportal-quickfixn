reviews:
  profile: assertive
  poem: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  request_changes_workflow: true

  auto_review:
    # OFF deliberately. The PR gate in .claude/review-policy.json decides which reviewers a PR
    # needs, and CodeRabbit is reserved for HIGH-tier changes. It meters reviews per DEVELOPER
    # IDENTITY across every repo in a rolling 7-day window, degrading from 30/7d, so it is the
    # scarce reviewer and must be spent deliberately. Leaving automatic review on reviews every
    # PR regardless of tier, which makes the tier evaluation pointless. HIGH-tier PRs get an
    # on-demand "@coderabbitai review", which still works with automatic review disabled.
    #
    # auto_pause_after_reviewed_commits is deliberately absent: it governs AUTOMATIC re-review
    # only, so with automatic review off it would be dead config that reads as load-bearing.
    enabled: false
    drafts: false
    # Kept, though it may now be inert. This repo's mainline is `fpsim`, NOT the GitHub default
    # branch (`master`, which tracks upstream QuickFIX/n and is never PR'd into), and
    # base_branches defaults to the default branch only. It documents the setting that automatic
    # review needed; whether an on-demand "@coderabbitai review" also honours it is unverified.
    # Left in place because keeping a dead key costs nothing and removing a live one would mean
    # silence on every PR in this repo.
    base_branches:
      - "fpsim"
    # REVERSED 2026-07-29. This block previously said "do NOT ignore dependabot[bot]", on the
    # grounds that dependency changes were classed HIGH and Gitar skipped bot authors, so
    # silencing CodeRabbit too would leave them unreviewed. Zero AI review of dependency bumps is
    # now the intended state: the estate raises enough of them that reviewing each one exhausts
    # the allowance and starves the changes that need it. Gitar's bot review is switched off as
    # well, and dependency manifests are no longer classed HIGH in the review policy. CI plus
    # Dependabot's own advisory data is what gates a bump.
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  path_filters:
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/*.lock"

  instructions: |
    Review as a senior engineer. Prioritise correctness, security, maintainability,
    testability, and accidental complexity.

    Do not nitpick style unless it affects readability or consistency.
    Prefer actionable findings over commentary.
    Treat generated files, lock files, snapshots, and formatting churn as low value.

    This is a FORK of QuickFIX/n (branch fpsim). Engine changes are deliberately gated —
    prefer flagging risk over proposing broad refactors, and never suggest re-aligning
    with upstream as a drive-by.

    Data dictionaries under spec/ and DataDictionaries/ drive DDTool code generation
    into a SHARED, name-keyed, processing-order-dependent namespace. A change scoped to
    one FIX version can therefore alter field availability or naming for another. Treat
    any dictionary edit as wire-affecting and say so explicitly.

    Generated code (Messages/, Fields/, Tags.cs) should not be hand-edited; flag direct
    edits there rather than reviewing them as ordinary source.
