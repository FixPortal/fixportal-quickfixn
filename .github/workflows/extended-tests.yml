name: Extended tests

on:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 5'

permissions:
  contents: read

jobs:
  extended-tests:
    name: Extended tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Acceptance
        run: dotnet test --no-restore --verbosity normal AcceptanceTest
