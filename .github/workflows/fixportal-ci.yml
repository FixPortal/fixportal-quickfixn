# FixPortal-owned CI for the fpsim deployment branch.
# Kept as a separate workflow from upstream's dotnet.yml so upstream
# merges never conflict on a branches-filter line.

name: FixPortal CI

on:
  push:
    branches: [ "fpsim" ]
  pull_request:
    branches: [ "fpsim" ]
  workflow_dispatch:

concurrency:
  group: fixportal-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/fpsim' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Lint workflows (actionlint)
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
      with:
        files: .github/workflows/fixportal-ci.yml
        shellcheck: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Unit Test
      run: dotnet test --no-build --verbosity normal UnitTests --blame-hang-timeout 30s --blame-hang-dump-type none

  acceptance:
    name: Acceptance tests
    # Adversarial finding R10 (2026-08-23): the acceptance suite had left every merge-blocking
    # lane — invisible to assert_gate_coverage.py precisely because it left the workflow the
    # checker audits. On a FIX engine this is the wire-level integration coverage; it belongs
    # in the gate. Reinstated as its own job so its 45-minute budget does not inflate the
    # build job's timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Acceptance
      # No --blame-hang-timeout here (unlike the unit-test step): several acceptance
      # definitions legitimately idle for a full HeartBtInt (30s+) waiting to observe a
      # TestRequest/Heartbeat, so a 30s inactivity abort kills healthy tests.
      run: dotnet test --no-restore --verbosity normal AcceptanceTest

  publish:
    name: Publish Package (GitHub NuGet)
    # Only publish on push to fpsim — not on PRs targeting fpsim, and not on tag pushes.
    # Adversarial finding R2 (2026-08-23): `github.event_name == 'push'` is true for a tag
    # push, so while `on.push.tags` existed, tagging ANY buildable commit — including an
    # unmerged feature branch — ran this job with packages: write, bypassing the reviewed
    # fpsim merge path. Tag creation is unrestricted (no tag-target rulesets exist), so the
    # tags trigger was dropped and the ref is pinned here. Reinstate tag-triggered releases
    # only behind a tag-namespace ruleset plus an explicit containment check in fpsim.
    if: github.event_name == 'push' && github.ref == 'refs/heads/fpsim'
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Pack
      run: dotnet pack QuickFIXn.sln -c Release -o _pkgout
    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push "_pkgout/*.nupkg" \
          --source "https://nuget.pkg.github.com/FixPortal/index.json" \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --skip-duplicate

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert every job in this workflow is gated
        env:
          GATE_EXEMPT: publish
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/fixportal-ci.yml

  # Required status check. Deliberately a pure aggregator of needs.*.result: it decides
  # what can merge, so it has no checkout, no parser and no network of its own.
  #
  # `if: always()` is load-bearing. Without it the job is SKIPPED when an upstream job
  # fails, a skipped job emits no check run at all, and a required context that never
  # reports leaves the pull request permanently unmergeable.
  #
  # `skipped` counts as a pass, which is what lets job-level `if:` conditions and path
  # filtering work; `failure` and `cancelled` do not.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [build, gate-coverage, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1
