# FixPortal-owned CI for the fpsim deployment branch.
# Kept as a separate workflow from upstream's dotnet.yml so upstream
# merges never conflict on a branches-filter line.

name: FixPortal CI

on:
  push:
    branches: [ "fpsim" ]
  pull_request:
    branches: [ "fpsim" ]

concurrency:
  group: fixportal-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/fpsim' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Unit Test
      run: dotnet test --no-build --verbosity normal UnitTests
    - name: Acceptance
      run: dotnet test --no-build --verbosity normal AcceptanceTest

  publish:
    name: Publish Package (GitHub NuGet)
    # Only publish on push to fpsim — not on PRs targeting fpsim.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x
    - name: Pack
      run: dotnet pack QuickFIXn.sln -c Release -o _pkgout
    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push "_pkgout/*.nupkg" \
          --source "https://nuget.pkg.github.com/FixPortal/index.json" \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --skip-duplicate
